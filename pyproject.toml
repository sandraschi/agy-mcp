[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-mcp"
version = "0.1.0"
description = "MCP server for Antigravity IDE â€” skill management, config bridge, agent orchestration"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.4,<4"]

[project.scripts]
agy-mcp = "agy_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"


                param($m)
                $inner = $m.Groups[2].Value.Trim()
                $insert = if ($inner) { "$inner, `"$RuffPyprojectSpec`"" } else { "`"$RuffPyprojectSpec`"" }
                $m.Groups[1].Value + $insert + $m.Groups[3].Value
            
